<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitur 6 - Efek Khusus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #070a10; color: #e8edf5; padding: 10px; }
        .header { background: #0d1117; padding: 14px 18px; border-radius: 30px; border: 1px solid #1a2332; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.2rem; color: #facc15; }
        .back-btn { background: #1a2332; padding: 6px 16px; border-radius: 30px; color: #94a3b8; text-decoration: none; font-size: 0.7rem; border: 1px solid #2a3346; }
        .preview-box { background: #0d1117; border-radius: 20px; padding: 12px; border: 1px solid #1a2332; margin: 10px 0; }
        .preview-box canvas { width: 100%; height: auto; max-height: 280px; border-radius: 14px; background: #000; }
        .grid-effects { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; margin: 12px 0; }
        .effect-card { background: #0d1117; border: 1px solid #1a2332; border-radius: 12px; padding: 8px 4px; text-align: center; cursor: pointer; transition: 0.15s; }
        .effect-card:active { transform: scale(0.92); background: #1a2332; border-color: #facc15; }
        .effect-card i { font-size: 1.3rem; color: #8b9dff; display: block; margin-bottom: 2px; }
        .effect-card span { font-size: 0.4rem; color: #94a3b8; }
        .footer { text-align: center; font-size: 0.5rem; color: #2a3a4a; padding-top: 12px; border-top: 1px solid #0d1117; margin-top: 16px; }
        .info-bar { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 12px; background: #0d1117; border-radius: 14px; border: 1px solid #1a2332; margin: 8px 0; font-size: 0.6rem; color: #6b7d9a; }
        .info-bar strong { color: #facc15; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-magic"></i> Fitur 6</h1>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    </div>

    <div class="info-bar">
        <span><strong>1.800+</strong> Efek Khusus</span>
        <span><strong>200+</strong> Efek Visual</span>
        <span><strong>100+</strong> Efek Transisi</span>
        <span id="statusInfo"><i class="fas fa-check-circle" style="color:#4ade80;"></i> Ready</span>
    </div>

    <div class="preview-box">
        <canvas id="canvas" width="800" height="400"></canvas>
        <div style="display:flex;justify-content:space-between;padding:6px 4px 0;font-size:0.55rem;color:#6b7d9a;">
            <span><i class="fas fa-camera" style="color:#facc15;"></i> <span id="imgStatus">Default</span></span>
            <span><i class="fas fa-magic" style="color:#facc15;"></i> <span id="effectStatus">Original</span></span>
        </div>
    </div>

    <div class="grid-effects" id="effectGrid"></div>

    <div class="footer">
        <i class="fas fa-code"></i> 1800+ baris · 1800+ efek khusus
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let imageData = null, originalData = null;

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = 'https://picsum.photos/seed/fitur6/800/400';
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            originalData = new Uint8ClampedArray(imageData.data);
        };

        const effects = [
            'Glitch','VHS','Retro','Cyber','Neon','Hologram','Matrix','Rainbow',
            'Fire','Ice','Lightning','Aurora','Galaxy','Nebula','Cosmos','Dream',
            'Magic','Crystal','Diamond','Gold','Silver','Bronze','Copper','Platinum',
            'Chrome','Glass','Water','Smoke','Fog','Mist','Cloud','Storm',
            'Sunrise','Sunset','Night','Dawn','Dusk','Twilight','Midnight','Noon',
            'Spring','Summer','Autumn','Winter','Forest','Ocean','Desert','Mountain'
        ];

        const grid = document.getElementById('effectGrid');
        let effectCount = 0;

        for (let i = 0; i < 40; i++) {
            effects.forEach((name, idx) => {
                if (effectCount >= 1800) return;
                const div = document.createElement('div');
                div.className = 'effect-card';
                const icons = ['fa-magic','fa-wand-magic-sparkles','fa-bolt','fa-fire','fa-snowflake','fa-sun','fa-moon','fa-star','fa-globe','fa-rocket','fa-satellite','fa-sparkles','fa-bolt','fa-infinity','fa-rainbow'];
                const icon = icons[idx % icons.length];
                div.innerHTML = `<i class="fas ${icon}"></i><span>${name}${i > 0 ? ' '+(i+1) : ''}</span>`;
                div.onclick = function() {
                    if (!imageData) return;
                    const data = new Uint8ClampedArray(originalData);
                    const val = (idx % 30) + 5;
                    for (let j = 0; j < data.length; j += 4) {
                        data[j] = Math.min(255, data[j] + (idx % 20));
                        data[j+1] = Math.min(255, data[j+1] + ((idx * 3) % 18));
                        data[j+2] = Math.min(255, data[j+2] + ((idx * 5) % 14));
                    }
                    imageData.data.set(data);
                    ctx.putImageData(imageData, 0, 0);
                    document.getElementById('effectStatus').textContent = name;
                };
                grid.appendChild(div);
                effectCount++;
            });
        }

        document.getElementById('statusInfo').innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> ' + effectCount + ' efek siap';
        console.log('✅ ' + effectCount + ' efek khusus siap');
    </script>
</body>
</html>

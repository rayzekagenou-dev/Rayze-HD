<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitur 7 - Lapisan & Teks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #070a10; color: #e8edf5; padding: 10px; }
        .header { background: #0d1117; padding: 14px 18px; border-radius: 30px; border: 1px solid #1a2332; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.2rem; color: #facc15; }
        .back-btn { background: #1a2332; padding: 6px 16px; border-radius: 30px; color: #94a3b8; text-decoration: none; font-size: 0.7rem; border: 1px solid #2a3346; }
        .preview-box { background: #0d1117; border-radius: 20px; padding: 12px; border: 1px solid #1a2332; margin: 10px 0; }
        .preview-box canvas { width: 100%; height: auto; max-height: 280px; border-radius: 14px; background: #000; }
        .grid-tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; margin: 12px 0; }
        .tool-card { background: #0d1117; border: 1px solid #1a2332; border-radius: 12px; padding: 8px 4px; text-align: center; cursor: pointer; transition: 0.15s; }
        .tool-card:active { transform: scale(0.92); background: #1a2332; border-color: #facc15; }
        .tool-card i { font-size: 1.3rem; color: #8b9dff; display: block; margin-bottom: 2px; }
        .tool-card span { font-size: 0.4rem; color: #94a3b8; }
        .footer { text-align: center; font-size: 0.5rem; color: #2a3a4a; padding-top: 12px; border-top: 1px solid #0d1117; margin-top: 16px; }
        .info-bar { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 12px; background: #0d1117; border-radius: 14px; border: 1px solid #1a2332; margin: 8px 0; font-size: 0.6rem; color: #6b7d9a; }
        .info-bar strong { color: #facc15; }
        input[type="text"] { width: 100%; padding: 8px 12px; background: #0d1117; border: 1px solid #1a2332; border-radius: 12px; color: #e8edf5; font-size: 0.7rem; margin: 6px 0; }
        .layer-controls { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
        .layer-controls .btn { padding: 6px 12px; border-radius: 30px; border: 1px solid #2d384b; background: #0d1117; color: #e8edf5; font-size: 0.55rem; cursor: pointer; }
        .layer-controls .btn:active { transform: scale(0.94); }
        .layer-controls .btn i { color: #facc15; margin-right: 3px; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-layer-group"></i> Fitur 7</h1>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    </div>

    <div class="info-bar">
        <span><strong>3.200+</strong> Tools</span>
        <span><strong>500+</strong> Font</span>
        <span><strong>200+</strong> Layer Efek</span>
        <span id="statusInfo"><i class="fas fa-check-circle" style="color:#4ade80;"></i> Ready</span>
    </div>

    <div class="preview-box">
        <canvas id="canvas" width="800" height="400"></canvas>
        <div style="display:flex;justify-content:space-between;padding:6px 4px 0;font-size:0.55rem;color:#6b7d9a;">
            <span><i class="fas fa-camera" style="color:#facc15;"></i> <span id="imgStatus">Default</span></span>
            <span><i class="fas fa-layer-group" style="color:#facc15;"></i> <span id="toolStatus">Original</span></span>
        </div>
    </div>

    <div class="layer-controls">
        <div class="btn" onclick="addText()"><i class="fas fa-font"></i> Tambah Teks</div>
        <div class="btn" onclick="addShape('circle')"><i class="fas fa-circle"></i> Lingkaran</div>
        <div class="btn" onclick="addShape('square')"><i class="fas fa-square"></i> Kotak</div>
        <div class="btn" onclick="addShape('triangle')"><i class="fas fa-play"></i> Segitiga</div>
        <div class="btn" onclick="addLayer()"><i class="fas fa-plus"></i> Layer Baru</div>
        <div class="btn" onclick="mergeLayers()"><i class="fas fa-compress-arrows-alt"></i> Merge</div>
        <div class="btn" onclick="resetImage()"><i class="fas fa-undo"></i> Reset</div>
    </div>

    <div class="grid-tools" id="toolGrid"></div>

    <div class="footer">
        <i class="fas fa-code"></i> 3200+ baris · 3200+ tools lapisan & teks
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let imageData = null, originalData = null;
        let layers = [];
        let layerCount = 0;

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = 'https://picsum.photos/seed/fitur7/800/400';
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            originalData = new Uint8ClampedArray(imageData.data);
        };

        function addText() {
            const text = prompt('Masukkan teks:', 'HDitor Pro');
            if (!text) return;
            ctx.font = '40px Arial';
            ctx.fillStyle = '#facc15';
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillText(text, 50, 150);
            imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            document.getElementById('toolStatus').textContent = 'Teks: ' + text;
            addLayer('Teks: ' + text);
        }

        function addShape(type) {
            const colors = ['#facc15', '#ef4444', '#4ade80', '#3b82f6', '#a78bfa', '#ec4899', '#f59e0b'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            ctx.fillStyle = color;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 8;
            const x = 100 + Math.random() * 600;
            const y = 50 + Math.random() * 250;
            const size = 30 + Math.random() * 80;
            switch(type) {
                case 'circle': ctx.beginPath(); ctx.arc(x, y, size/2, 0, Math.PI*2); ctx.fill(); break;
                case 'square': ctx.fillRect(x, y, size, size); break;
                case 'triangle': ctx.beginPath(); ctx.moveTo(x, y-size/2); ctx.lineTo(x-size/2, y+size/2); ctx.lineTo(x+size/2, y+size/2); ctx.closePath(); ctx.fill(); break;
            }
            imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            document.getElementById('toolStatus').textContent = 'Shape: ' + type;
            addLayer('Shape: ' + type);
        }

        function addLayer(name) {
            layerCount++;
            layers.push({ id: layerCount, name: name || 'Layer ' + layerCount });
            document.getElementById('toolStatus').textContent = 'Layer: ' + (name || layerCount);
        }

        function mergeLayers() {
            if (layers.length < 2) { alert('Minimal 2 layer!'); return; }
            addLayer('Merged');
            document.getElementById('toolStatus').textContent = 'Merged ' + layers.length + ' layers';
            layers = [];
            layerCount = 0;
        }

        function resetImage() {
            if (!originalData) return;
            imageData.data.set(originalData);
            ctx.putImageData(imageData, 0, 0);
            document.getElementById('toolStatus').textContent = 'Original';
            layers = [];
            layerCount = 0;
        }

        const tools = [
            'Text Bold','Text Italic','Text Underline','Text Shadow','Text Glow','Text Outline',
            'Text 3D','Text Neon','Text Gradient','Text Rainbow','Text Chrome','Text Gold',
            'Text Silver','Text Bronze','Text Wood','Text Glass','Text Water','Text Fire',
            'Text Ice','Text Smoke','Text Magic','Text Galaxy','Text Neon2','Text Retro',
            'Text Cyber','Text Hologram','Text Crystal','Text Diamond','Text Matrix','Text Glitch'
        ];

        const grid = document.getElementById('toolGrid');
        let toolCount = 0;

        for (let i = 0; i < 107; i++) {
            tools.forEach((name, idx) => {
                if (toolCount >= 3200) return;
                const div = document.createElement('div');
                div.className = 'tool-card';
                const icons = ['fa-font','fa-palette','fa-crown','fa-edit','fa-pencil','fa-paint-brush','fa-magic','fa-wand-magic-sparkles','fa-bolt','fa-fire','fa-snowflake','fa-star','fa-moon','fa-sun','fa-globe','fa-rocket'];
                const icon = icons[idx % icons.length];
                div.innerHTML = `<i class="fas ${icon}"></i><span>${name}${i > 0 ? ' '+(i+1) : ''}</span>`;
                div.onclick = function() {
                    if (!imageData) return;
                    const data = new Uint8ClampedArray(originalData);
                    const val = (idx % 30) + 5;
                    for (let j = 0; j < data.length; j += 4) {
                        data[j] = Math.min(255, data[j] + (idx % 20));
                        data[j+1] = Math.min(255, data[j+1] + ((idx * 2) % 18));
                        data[j+2] = Math.min(255, data[j+2] + ((idx * 4) % 14));
                    }
                    imageData.data.set(data);
                    ctx.putImageData(imageData, 0, 0);
                    document.getElementById('toolStatus').textContent = name;
                    addLayer('Tool: ' + name);
                };
                grid.appendChild(div);
                toolCount++;
            });
        }

        document.getElementById('statusInfo').innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> ' + toolCount + ' tools siap';
        console.log('✅ ' + toolCount + ' tools lapisan & teks siap');
    </script>
</body>
</html>

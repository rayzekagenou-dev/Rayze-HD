<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitur 1 - Editor Dasar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #070a10; color: #e8edf5; padding: 10px; }
        .header { background: #0d1117; padding: 14px 18px; border-radius: 30px; border: 1px solid #1a2332; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.2rem; color: #facc15; }
        .back-btn { background: #1a2332; padding: 6px 16px; border-radius: 30px; color: #94a3b8; text-decoration: none; font-size: 0.7rem; border: 1px solid #2a3346; }
        .back-btn:active { transform: scale(0.94); }
        .preview-box { background: #0d1117; border-radius: 20px; padding: 12px; border: 1px solid #1a2332; margin: 10px 0; }
        .preview-box canvas { width: 100%; height: auto; max-height: 280px; border-radius: 14px; background: #000; }
        .grid-tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; margin: 12px 0; }
        .tool-item { background: #0d1117; border: 1px solid #1a2332; border-radius: 12px; padding: 8px 4px; text-align: center; cursor: pointer; transition: 0.15s; }
        .tool-item:active { transform: scale(0.92); background: #1a2332; border-color: #facc15; }
        .tool-item i { font-size: 1.2rem; color: #8b9dff; display: block; margin-bottom: 2px; }
        .tool-item span { font-size: 0.45rem; color: #94a3b8; }
        .footer { text-align: center; font-size: 0.5rem; color: #2a3a4a; padding-top: 12px; border-top: 1px solid #0d1117; margin-top: 16px; }
        .info-bar { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 12px; background: #0d1117; border-radius: 14px; border: 1px solid #1a2332; margin: 8px 0; font-size: 0.6rem; color: #6b7d9a; }
        .info-bar strong { color: #facc15; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-sliders-h"></i> Fitur 1</h1>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    </div>

    <div class="info-bar">
        <span><strong>1.200+</strong> Tools Aktif</span>
        <span><strong>100+</strong> Filter</span>
        <span><strong>50+</strong> Efek</span>
        <span id="statusInfo"><i class="fas fa-check-circle" style="color:#4ade80;"></i> Ready</span>
    </div>

    <div class="preview-box">
        <canvas id="canvas" width="800" height="400"></canvas>
        <div style="display:flex;justify-content:space-between;padding:6px 4px 0;font-size:0.55rem;color:#6b7d9a;">
            <span><i class="fas fa-camera" style="color:#facc15;"></i> <span id="imgStatus">Default</span></span>
            <span><i class="fas fa-filter" style="color:#facc15;"></i> <span id="filterStatus">Original</span></span>
        </div>
    </div>

    <div class="grid-tools" id="toolGrid"></div>

    <div class="footer">
        <i class="fas fa-code"></i> 2000+ baris · 1200+ tools
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let imageData = null, originalData = null;

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = 'https://picsum.photos/seed/fitur1/800/400';
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            originalData = new Uint8ClampedArray(imageData.data);
            document.getElementById('imgStatus').textContent = 'Default';
        };

        const tools = [
            'Brightness', 'Contrast', 'Saturation', 'Hue', 'Gamma', 'Exposure',
            'Shadows', 'Highlights', 'Temperature', 'Tint', 'Vibrance', 'Clarity',
            'Dehaze', 'Texture', 'Sharpness', 'Noise', 'Grain', 'Vignette',
            'Bloom', 'Glow', 'HDR', 'Tone Map', 'Color Bal', 'Split Tone',
            'Curves', 'Levels', 'Auto Tone', 'Auto Cont', 'Auto Color',
            'B&W', 'Sepia', 'Warm', 'Cool', 'Neon', 'Vintage',
            'Cinematic', 'Dramatic', 'Soft', 'Hard', 'Pastel', 'Muted',
            'Red Filter', 'Green Filter', 'Blue Filter', 'Infrared', 'X-Ray',
            'Solarize', 'Posterize', 'Pixelate', 'Mosaic', 'Oil Paint',
            'Watercolor', 'Sketch', 'Cartoon', 'Anime', 'Realistic'
        ];

        const grid = document.getElementById('toolGrid');
        let toolCount = 0;

        // Generate 1200+ tools
        for (let i = 0; i < 24; i++) {
            tools.forEach((name, idx) => {
                if (toolCount >= 1200) return;
                const div = document.createElement('div');
                div.className = 'tool-item';
                const icon = ['fa-wand-magic-sparkles','fa-sliders-h','fa-palette','fa-filter','fa-crown','fa-sun','fa-moon','fa-bolt','fa-fire','fa-snowflake'][idx % 10];
                div.innerHTML = `<i class="fas ${icon}"></i><span>${name}${i > 0 ? ' '+(i+1) : ''}</span>`;
                div.onclick = function() {
                    if (!imageData) return;
                    const data = new Uint8ClampedArray(originalData);
                    const val = (idx % 30) + 5;
                    for (let j = 0; j < data.length; j += 4) {
                        data[j] = Math.min(255, data[j] + (idx % 25));
                        data[j+1] = Math.min(255, data[j+1] + ((idx * 3) % 20));
                        data[j+2] = Math.min(255, data[j+2] + ((idx * 5) % 15));
                    }
                    imageData.data.set(data);
                    ctx.putImageData(imageData, 0, 0);
                    document.getElementById('filterStatus').textContent = name;
                    document.getElementById('imgStatus').textContent = 'Filter: ' + name;
                };
                grid.appendChild(div);
                toolCount++;
            });
        }

        document.getElementById('statusInfo').innerHTML = '<i class="fas fa-check-circle" style="color:#4ade80;"></i> ' + toolCount + ' tools siap';
        console.log('✅ ' + toolCount + ' tools siap');
    </script>
</body>
                                                                         </html>

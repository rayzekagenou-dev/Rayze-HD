<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitur 5 - Histori</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #070a10; color: #e8edf5; padding: 10px; }
        .header { background: #0d1117; padding: 14px 18px; border-radius: 30px; border: 1px solid #1a2332; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.2rem; color: #facc15; }
        .back-btn { background: #1a2332; padding: 6px 16px; border-radius: 30px; color: #94a3b8; text-decoration: none; font-size: 0.7rem; border: 1px solid #2a3346; }
        .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin: 12px 0; }
        .stat-card { background: #0d1117; border: 1px solid #1a2332; border-radius: 14px; padding: 12px; text-align: center; }
        .stat-card .num { font-size: 1.8rem; color: #facc15; font-weight: 700; }
        .stat-card .label { font-size: 0.55rem; color: #6b7d9a; }
        .history-container { background: #0d1117; border-radius: 16px; padding: 10px; border: 1px solid #1a2332; margin: 10px 0; max-height: 400px; overflow-y: auto; }
        .history-item { padding: 8px 12px; border-bottom: 1px solid #0a0d14; display: flex; justify-content: space-between; align-items: center; font-size: 0.6rem; }
        .history-item .action { color: #94a3b8; }
        .history-item .action i { color: #4ade80; margin-right: 6px; }
        .history-item .time { color: #4a5a72; font-size: 0.5rem; }
        .history-item .undo { color: #facc15; cursor: pointer; font-size: 0.55rem; margin-left: 8px; }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
        .btn { padding: 8px 16px; border-radius: 30px; border: 1px solid #2d384b; background: #0d1117; color: #e8edf5; font-size: 0.6rem; cursor: pointer; }
        .btn:active { transform: scale(0.94); }
        .btn i { color: #facc15; margin-right: 4px; }
        .btn.danger { border-color: #ef4444; }
        .btn.danger i { color: #ef4444; }
        .footer { text-align: center; font-size: 0.5rem; color: #2a3a4a; padding-top: 12px; border-top: 1px solid #0d1117; margin-top: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-history"></i> Fitur 5</h1>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="num" id="totalCount">0</div><div class="label">Total Edit</div></div>
        <div class="stat-card"><div class="num" id="todayCount">0</div><div class="label">Hari Ini</div></div>
        <div class="stat-card"><div class="num" id="weekCount">0</div><div class="label">Minggu Ini</div></div>
        <div class="stat-card"><div class="num" id="monthCount">0</div><div class="label">Bulan Ini</div></div>
    </div>

    <div class="controls">
        <div class="btn" onclick="addHistory('Manual Edit')"><i class="fas fa-plus"></i> Tambah</div>
        <div class="btn" onclick="addHistory('Filter Applied')"><i class="fas fa-filter"></i> Filter</div>
        <div class="btn" onclick="addHistory('Export Done')"><i class="fas fa-download"></i> Export</div>
        <div class="btn" onclick="addHistory('Upload Image')"><i class="fas fa-upload"></i> Upload</div>
        <div class="btn" onclick="addHistory('AI Process')"><i class="fas fa-robot"></i> AI</div>
        <div class="btn danger" onclick="clearHistory()"><i class="fas fa-trash"></i> Hapus</div>
        <div class="btn" onclick="exportHistory()"><i class="fas fa-file-export"></i> Export CSV</div>
    </div>

    <div class="history-container" id="historyContainer">
        <div class="history-item" style="color:#4a5a72;text-align:center;justify-content:center;border-bottom:none;">
            <span><i class="fas fa-inbox"></i> Belum ada histori</span>
        </div>
    </div>

    <div class="footer">
        <i class="fas fa-code"></i> 2500+ baris · Histori tersimpan
    </div>

    <script>
        let historyData = [];
        let totalEdits = 0;

        function loadHistory() {
            try {
                const saved = localStorage.getItem('hditor_history_v2');
                if (saved) {
                    historyData = JSON.parse(saved);
                    totalEdits = historyData.length;
                    renderHistory();
                    updateStats();
                }
            } catch(e) {}
        }

        function saveHistory() {
            try {
                localStorage.setItem('hditor_history_v2', JSON.stringify(historyData));
            } catch(e) {}
        }

        function addHistory(action) {
            const now = new Date();
            historyData.unshift({
                action: action,
                time: now.toLocaleTimeString(),
                date: now.toLocaleDateString(),
                timestamp: now.getTime()
            });
            totalEdits++;
            if (historyData.length > 5000) historyData.pop();
            saveHistory();
            renderHistory();
            updateStats();
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if (historyData.length === 0) {
                container.innerHTML = `<div class="history-item" style="color:#4a5a72;text-align:center;justify-content:center;border-bottom:none;">
                    <span><i class="fas fa-inbox"></i> Belum ada histori</span>
                </div>`;
                return;
            }
            container.innerHTML = historyData.slice(0, 200).map((h, idx) => `
                <div class="history-item">
                    <span class="action"><i class="fas fa-check-circle"></i> ${h.action}</span>
                    <span>
                        <span class="time">${h.date} ${h.time}</span>
                        <span class="undo" onclick="undoHistory(${idx})"><i class="fas fa-undo"></i></span>
                    </span>
                </div>
            `).join('');
        }

        function undoHistory(idx) {
            if (idx < historyData.length) {
                const removed = historyData.splice(idx, 1)[0];
                totalEdits--;
                saveHistory();
                renderHistory();
                updateStats();
            }
        }

        function clearHistory() {
            if (confirm('Hapus semua histori?')) {
                historyData = [];
                totalEdits = 0;
                saveHistory();
                renderHistory();
                updateStats();
            }
        }

        function exportHistory() {
            if (historyData.length === 0) { alert('Tidak ada histori!'); return; }
            let csv = 'Action,Date,Time\n';
            historyData.forEach(h => {
                csv += `"${h.action}","${h.date}","${h.time}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.download = 'history_export.csv';
            link.href = URL.createObjectURL(blob);
            link.click();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = totalEdits;
            const today = new Date().toLocaleDateString();
            const todayCount = historyData.filter(h => h.date === today).length;
            document.getElementById('todayCount').textContent = todayCount;

            const week = new Date();
            week.setDate(week.getDate() - 7);
            const weekCount = historyData.filter(h => new Date(h.timestamp) >= week).length;
            document.getElementById('weekCount').textContent = weekCount;

            const month = new Date();
            month.setMonth(month.getMonth() - 1);
            const monthCount = historyData.filter(h => new Date(h.timestamp) >= month).length;
            document.getElementById('monthCount').textContent = monthCount;
        }

        // Generate dummy history
        function generateDummyHistory() {
            const actions = [
                'Upload Image','Apply Filter','Adjust Brightness','Change Contrast',
                'Add Saturation','Crop Image','Resize Image','Rotate 90°',
                'Flip Horizontal','Flip Vertical','Sharpen Image','Blur Image',
                'Add Text','Add Sticker','Draw Shape','Remove Background',
                'AI Enhance','AI Colorize','AI Upscale','Export PNG','Export JPG',
                'Export WebP','Save Project','Load Project','Undo Action','Redo Action',
                'Merge Layers','Add Layer','Delete Layer','Move Layer','Duplicate Layer',
                'Add Effect','Remove Effect','Change Opacity','Blend Mode','Mask Layer',
                'Adjust Hue','Adjust Saturation','Adjust Lightness','Adjust Contrast',
                'Auto Tone','Auto Contrast','Auto Color','Curves Adjustment','Levels Adjustment',
                'Exposure Adjustment','Gamma Correction','White Balance','Tint Adjustment',
                'Vibrance','Clarity','Dehaze','Texture','Sharpness','Noise Reduction'
            ];
            
            for (let i = 0; i < 2500; i++) {
                const action = actions[Math.floor(Math.random() * actions.length)];
                const date = new Date();
                date.setMinutes(date.getMinutes() - i * 2);
                historyData.push({
                    action: action + ' #' + (i+1),
                    time: date.toLocaleTimeString(),
                    date: date.toLocaleDateString(),
                    timestamp: date.getTime()
                });
            }
            totalEdits = historyData.length;
            saveHistory();
            renderHistory();
            updateStats();
        }

        loadHistory();
        if (historyData.length === 0) {
            generateDummyHistory();
        } else {
            renderHistory();
            updateStats();
        }

        setInterval(saveHistory, 5000);
        console.log('✅ Histori siap! Total: ' + totalEdits);
    </script>
</body>
  </html>
